name: financeflow
description: Movo — premium financial management app.
publish_to: 'none'

version: 1.0.6+7

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  connectivity_plus: ^7.1.1
  app_settings: ^7.0.0

  # Media
  image_picker: ^1.0.7

  # Persistence
  shared_preferences: ^2.2.2
  # Шифрованное хранилище для чувствительных данных (PIN-код).
  # Android: EncryptedSharedPreferences (AES-256)
  # iOS: Keychain Services
  flutter_secure_storage: ^9.2.4

  # Биометрия (отпечаток пальца, Face ID)
  local_auth: ^2.3.0

  # Formatting
  intl: ^0.20.2

  # Ads
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - public/logo.png
